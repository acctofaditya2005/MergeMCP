[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merge-mcp"
version = "0.3.0"
description = "An MCP server that helps newcomers land open-source contributions maintainers will accept, plus a benchmark that measures how well agents do it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aditya" }]
keywords = ["mcp", "model-context-protocol", "agents", "open-source", "evaluation", "github"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "fastmcp>=4.1,<5",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
merge-mcp = "merge_mcp.server:main"
merge-eval = "merge_mcp.eval.cli:main"

[project.urls]
Documentation = "https://github.com/acctofaditya2005/MergeMCP#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/merge_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon", "network: needs network access"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# ASYNC109: timeouts are explicit parameters. ASYNC230/240: small local file writes are fine.
ignore = ["ASYNC109", "ASYNC230", "ASYNC240"]
